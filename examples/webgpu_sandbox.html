<html lang="en">
	<head>
		<title>three.js webgpu - sandbox</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>WebGPU sandbox</span>
			</div>

			<small>A sandbox for testing basic scene setups.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../src/three.webgpu.js",
					"three/webgpu": "../src/three.webgpu.js",
					"three/tsl": "../src/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as TSL from 'three/tsl';

let mesh, renderer, scene, camera, controls;

init();

function init() {

	// renderer
	renderer = new THREE.WebGPURenderer();
	renderer.setSize( window.innerWidth, window.innerHeight );
	renderer.setPixelRatio( window.devicePixelRatio );
	renderer.setAnimationLoop( animate );
	renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
	document.body.appendChild( renderer.domElement );

	// scene
	scene = new THREE.Scene();
	scene.background = new THREE.Color( 0x000000 );

	// camera
	camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 10000 );
	camera.position.set( 20, 20, 20 );

	// controls
	controls = new OrbitControls( camera, renderer.domElement );
	// geometry
	const geometry = new THREE.SphereGeometry( 5, 12, 8 );

	// material
	const material = new THREE.MeshBasicNodeMaterial();
	const tex = new THREE.DataTexture( new Uint8Array( [ 1, 0, 0, 1 ] ), 1, 1 );
	tex.needsUpdate = true;
	const texNode = TSL.uniformTexture( tex );
	const samplerNode = TSL.sampler( tex );
	console.log( texNode.uuid, samplerNode.node.uuid );
	material.colorNode = TSL.wgslFn( /* wgsl */`
        fn test(
            tex: texture_2d<f32>,
            smp: sampler
        ) -> vec4f {

            // return textureSample( tex, smp, vec2f( 0.0 ) );
            return vec4f( 1.0, 0, 0, 1 );

        }
    ` )( { tex: texNode, smp: samplerNode } );

	// mesh
	mesh = new THREE.Mesh( geometry, material );
	scene.add( mesh );

}

function animate() {

	renderer.render( scene, camera );

}


		</script>
	</body>
</html>
