<html lang="en">
	<head>
		<title>three.js webgpu - sandbox</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgpu - sandbox
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../src/three.webgpu.js",
					"three/webgpu": "../src/three.webgpu.js",
					"three/tsl": "../src/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { wgslFn, textureStore } from 'three/tsl';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			let mesh, renderer, scene, camera, controls;

			init();

			async function init() {

				// renderer
				renderer = new THREE.WebGPURenderer();
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				// scene
				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x000000 );
				
				// camera
				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 10000 );
				camera.position.set( 20, 20, 20 );

				// controls
				controls = new OrbitControls( camera, renderer.domElement );

				// geometry
				const geometry = new THREE.SphereGeometry( 5, 12, 8 );

				const tex = new THREE.StorageTexture( 1, 1 );
				tex.format = THREE.RGBAFormat;
				tex.type = THREE.UnsignedByteType;
				tex.magFilter = THREE.LinearFilter;

				// material
				const material = new THREE.MeshBasicNodeMaterial();
				const computeKernel = wgslFn( `
					fn compute( outputTex: texture_storage_2d<rgba8unorm, write> ) -> vec4f {

						textureStore( outputTex, vec2u( 0, 0 ), vec4f( 1, 0, 0, 1 ) );

						return vec4f( 1, 0, 0, 1 );

					}
				` )( {
					outputTex: textureStore( tex ),
				} ).compute( 1, [ 1, 1, 1 ] );

				await renderer.computeAsync( computeKernel );

				tex.dispose();

				await renderer.computeAsync( computeKernel );

				// mesh
				mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );
				
			}

			function animate() {

				renderer.render( scene, camera );

			}


		</script>
	</body>
</html>
