<html lang="en">
	<head>
		<title>three.js webgpu - sandbox</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgpu - sandbox
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../src/three.webgpu.js",
					"three/webgpu": "../src/three.webgpu.js",
					"three/tsl": "../src/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import {
  Camera,
  DoubleSide,
  Mesh,
  PerspectiveCamera,
  PlaneGeometry,
  Scene
} from 'three'
import { positionGeometry, struct, vec3, vec4 } from 'three/tsl'
import { NodeMaterial, WebGPURenderer } from 'three/webgpu'

async function init() {
  const renderer = new WebGPURenderer()
  await renderer.init()
  document.body.appendChild(renderer.domElement)

  const camera = new PerspectiveCamera()
  const scene = new Scene()

  const S = struct({ x: 'vec3' }, 'S')
  const T = struct({ s: 'S' })
  const t = T(S(vec3(0)))

  // output.color = vec4<f32>( f32( nodeVar0.s.x ), 1.0 );
  const outputNode = vec4(t.get('s').get('x'), 1)

  debugShader(renderer, outputNode)

  const material = new NodeMaterial()
  material.vertexNode = vec4(positionGeometry.xy.mul(2), 0, 1)
  material.fragmentNode = outputNode
  material.side = DoubleSide
  scene.add(new Mesh(new PlaneGeometry(), material))

  void renderer.render(scene, camera)
}

init().catch(error => {
  console.error(error)
})

function debugShader(renderer, node) {
  const material = new NodeMaterial()
  material.fragmentNode = node
  const mesh = new Mesh(undefined, material)

  renderer.debug
    .getShaderAsync(new Scene(), new Camera(), mesh)
    .then(result => {
      console.log(result.fragmentShader ?? '')
    })
    .catch((error) => {
      console.error(error)
    })
    .finally(() => {
      material.dispose()
    })
}


		</script>
	</body>
</html>
