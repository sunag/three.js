<html lang="en">
	<head>
		<title>three.js webgpu - sandbox</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<script type="importmap">
			{
				"imports": {
					"three": "../src/three.webgpu.js",
					"three/webgpu": "../src/three.webgpu.js",
					"three/tsl": "../src/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { texture, float, Loop, int, Fn, bool, Break, If, vec2, vec3, uv, color, positionLocal } from 'three/tsl';

			let camera, scene, renderer;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.1, 10 );
				camera.position.z = 4;

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x222222 );

				renderer = new THREE.WebGPURenderer( { antialias: true, forceWebGL: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				const textureLoader = new THREE.TextureLoader();
				const uvTexture = textureLoader.load( './textures/uv_grid_opengl.jpg' );

				const test = Fn( () => {

					const texNode = texture( uvTexture ).toStack();
					texNode.NAME = 'TEST';

					const customColor = color( 0x000000 );

					/*Loop( { start: int( 1 ), end: int( 5 ) }, ( { i } ) => {

						Loop( { start: int( 1 ), end: int( 5 ), name: 'j' }, ( { j } ) => {

							const result = texNode.mul( .2 ).add( i ).add( j );

							customColor.addAssign( result );

						} );

					} );*/

					If( true, () => {

						customColor.addAssign( texNode.add( 1 ) );

					} ).Else( () => {

						customColor.addAssign( texNode.mul( 2 ) );

					} );

					return customColor.debug();

				} );

				const material = new THREE.NodeMaterial();
				material.colorNode = test().context().add( test().context( {

					getUV: () => uv().add( .1 )

				} ) );

				material.colorNode = test();

				const mesh = new THREE.Mesh( new THREE.PlaneGeometry(), material );
				scene.add( mesh );

				renderer.setAnimationLoop( () => {

					renderer.render( scene, camera );

				} );

			}

		</script>
	</body>
</html>
