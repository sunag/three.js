<html lang="en">
	<head>
		<title>three.js webgpu - sandbox</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgpu - sandbox
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../src/three.webgpu.js",
					"three/webgpu": "../src/three.webgpu.js",
					"three/tsl": "../src/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { time, vec2, uv, texture, vec3, mix, Fn, positionView, normalView, normalWorld, checker, positionWorldDirection, positionWorld, normalLocal, positionLocal, color, oscSine, attribute } from 'three/tsl';

			import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			let camera, scene, renderer;

			let box;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.1, 10 );
				camera.position.z = - 4;

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x222222 );

				//

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
				document.body.appendChild( renderer.domElement );

				// textures

				const textureLoader = new THREE.TextureLoader();
				const uvTexture = textureLoader.load( './textures/uv_grid_opengl.jpg' );
				uvTexture.wrapS = THREE.RepeatWrapping;
				uvTexture.wrapT = THREE.RepeatWrapping;
				uvTexture.name = 'uv_grid';

				const textureDisplace = textureLoader.load( './textures/transition/transition1.png' );
				textureDisplace.wrapS = THREE.RepeatWrapping;
				textureDisplace.wrapT = THREE.RepeatWrapping;

				// displace example

				const geometrySphere = new THREE.SphereGeometry( .5, 64, 64 );
				//const materialSphere = new THREE.MeshBasicNodeMaterial();
				const materialSphere = new THREE.MeshPhongNodeMaterial();

				materialSphere.colorNode = normalView;
				//materialSphere.outputNode = normalWorld.toVec4();
				//materialSphere.colorNode = positionWorld;
				materialSphere.normalNode = normalView;
				materialSphere.positionNode = ( Fn( () => {

					//return positionWorld.sub( vec3( 3, 0, 0 ) );
					return positionLocal.sub( vec3( 1, 0, 0 ) );//.add( normalWorld.mul( .3 ) );
					//return positionWorld.sub( vec3( 3, 0, 0 ) );//.add( displace );

				} ) )();

				const direct = new THREE.DirectionalLight( 0xffffff, 1 );
				direct.position.set( 0, 1, 1 );
				scene.add( direct );	

				const sphere = new THREE.Mesh( geometrySphere, materialSphere );
				sphere.scale.setScalar( 2 );
				sphere.position.set( 2, 0, 0 );
				scene.add( sphere );

				new OrbitControls( camera, renderer.domElement );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				if ( box ) {

					box.rotation.x += 0.01;
					box.rotation.y += 0.02;

				}

				renderer.render( scene, camera );

			}

			function createDataTexture() {

				const color = new THREE.Color( 0xff0000 );

				const width = 512;
				const height = 512;

				const size = width * height;
				const data = new Uint8Array( 4 * size );

				const r = Math.floor( color.r * 255 );
				const g = Math.floor( color.g * 255 );
				const b = Math.floor( color.b * 255 );

				for ( let i = 0; i < size; i ++ ) {

					const stride = i * 4;

					data[ stride ] = r;
					data[ stride + 1 ] = g;
					data[ stride + 2 ] = b;
					data[ stride + 3 ] = 255;

				}

				const texture = new THREE.DataTexture( data, width, height, THREE.RGBAFormat );
				texture.needsUpdate = true;
				return texture;

			}

			/*
			 * Correct UVs to be compatible with `flipY=false` textures.
			 */
			function flipY( geometry ) {

				const uv = geometry.attributes.uv;

				for ( let i = 0; i < uv.count; i ++ ) {

					uv.setY( i, 1 - uv.getY( i ) );

				}

				return geometry;

			}

		</script>
	</body>
</html>
