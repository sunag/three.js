<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - mrt</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - mrt">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_mrt.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_mrt.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Multiple Render Targets (MRT)</span>
			</div>

			<small>
				Final / Beauty / Normal / Emissive / Diffuse
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../src/three.webgpu.js",
					"three/webgpu": "../src/three.webgpu.js",
					"three/tsl": "../src/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { output, normalView, vec4, vec3, pass, step, positionWorld, materialAO, ambientOcclusion, context, diffuseColor, emissive, packNormalToRGB, screenUV, mix, mrt, Fn, unpackRGBToNormal, cameraProjectionMatrixInverse, cameraWorldMatrix, lights, lightingContext, diffuseContribution, specularColor, specularColorBlended, specularF90, metalness, roughness, texture, positionViewDirection, getViewPosition, uniform, perspectiveDepthToViewZ } from 'three/tsl';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			import { UltraHDRLoader } from 'three/addons/loaders/UltraHDRLoader.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			let camera, scene, renderer;
			let renderPipeline;

			init();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				// scene

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.25, 20 );
				camera.position.set( - 1.8, 0.6, 2.7 );

				scene = new THREE.Scene();

				const envTextureNode = texture( new THREE.Texture() );

				new UltraHDRLoader()
					.setPath( 'textures/equirectangular/' )
					.load( 'royal_esplanade_2k.hdr.jpg', function ( texture ) {

						texture.mapping = THREE.EquirectangularReflectionMapping;

						//scene.background = texture;
						//scene.environment = texture;
						envTextureNode.value = texture;

						// model

						const loader = new GLTFLoader().setPath( 'models/gltf/DamagedHelmet/glTF/' );
						loader.load( 'DamagedHelmet.gltf', function ( gltf ) {

							scene.add( gltf.scene );

						} );

					} );

				// renderer

				renderer = new THREE.WebGPURenderer( { antialias: true, requiredLimits: { maxColorAttachments: 5 } } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( render );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.inspector = new Inspector();
				//renderer.lighting.enabled = false;
				container.appendChild( renderer.domElement );

				const pointLight = new THREE.PointLight( 0xffffff, 50, 10 );
				pointLight.position.set( 1, 1, 1 );
				scene.add( pointLight );

				// post processing

				const scenePass = pass( scene, camera, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter } );
				scenePass.transparent = false;
				scenePass.setMRT( mrt( {
					output: output
				} ) );

				// post processing - mrt

				renderPipeline = new THREE.RenderPipeline( renderer );
				renderPipeline.outputColorTransform = false;
				renderPipeline.outputNode = Fn( () => {

					const output = scenePass.getTextureNode( 'output' );

					return output.renderOutput();

				} )();

				// controls

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 2;
				controls.maxDistance = 10;
				controls.target.set( 0, 0, - 0.2 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function render() {

				renderPipeline.render();

			}

		</script>

	</body>
</html>
