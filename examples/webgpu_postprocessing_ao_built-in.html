<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - built-in ambient occlusion</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgpu - postprocessing - built-in ambient occlusion<br />
			Pre-pass ambient occlusion and use it in forward shading for physically based rendering.<br />
			<a href="https://skfb.ly/oCnNx" target="_blank" rel="noopener">Minimalistic Modern Bedroom</a> by 
			<a href="https://sketchfab.com/dylanheyes" target="_blank" rel="noopener">dylanheyes</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Creative Commons Attribution</a>.<br />
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../src/three.webgpu.js",
					"three/webgpu": "../src/three.webgpu.js",
					"three/tsl": "../src/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { pass, normalView, directionToColor, colorToDirection } from 'three/tsl';
			import { ao } from 'three/addons/tsl/display/GTAONode.js';
			import { denoise } from 'three/addons/tsl/display/DenoiseNode.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			let camera, scene, renderer, postProcessing, controls;

			let aoPass, denoisePass, scenePass;

			const params = {
				distanceExponent: 1,
				distanceFallOff: 1,
				radius: 0.25,
				scale: 1,
				thickness: 1,
				denoised: false,
				enabled: true,
				denoiseRadius: 5,
				lumaPhi: 5,
				depthPhi: 5,
				normalPhi: 5
			};

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 50 );
				camera.position.set( 1, 1.3, 5 );

				scene = new THREE.Scene();

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				const environment = new RoomEnvironment();
				const pmremGenerator = new THREE.PMREMGenerator( renderer );

				scene.background = new THREE.Color( 0x666666 );
				scene.environment = pmremGenerator.fromScene( environment ).texture;
				environment.dispose();
				pmremGenerator.dispose();

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 0.5, - 1 );
				controls.update();
				controls.enablePan = false;
				controls.enableDamping = true;
				controls.minDistance = 2;
				controls.maxDistance = 8;

				// Post Processing

				postProcessing = new THREE.PostProcessing( renderer );

				// Opaque Pass

				const normalPassMaterial = new THREE.NodeMaterial();
				normalPassMaterial.lights = false;
				normalPassMaterial.fog = false;
				normalPassMaterial.colorNode = directionToColor( normalView ); // pack the normal vector into color

				const opaquePass = pass( scene, camera );
				opaquePass.transparent = false;
				opaquePass.overrideMaterial = normalPassMaterial;

				// Textures

				const passNormalView = opaquePass.getTextureNode();
				const passDepth = opaquePass.getTextureNode( 'depth' );

				const customPassNormalView = passNormalView.clone();
				customPassNormalView.sample = ( uv ) => {

					// TODO: Replace for custom sampling:
					// const customPassNormalView = sample( ( uv ) => colorToDirection( passNormalView.sample( uv ) ) );

					return colorToDirection( passNormalView.sample( uv ) ); // unpack the color back to a normal vector

				};

				// AO

				aoPass = ao( passDepth, customPassNormalView, camera );
				aoPass.resolutionScale = 0.5; // running AO in half resolution is often sufficient

				// denoise (optional, use it if you need best quality but is has a noticeable hit on performance)

				denoisePass = denoise( aoPass.getTextureNode(), passDepth, customPassNormalView, camera );

				// Final

				scenePass = pass( scene, camera )
					.input( 'ao', ( node ) => {

						let preProcessingAO = null;

						if ( params.enabled === true ) {

							if ( params.denoised === true ) {

								preProcessingAO = denoisePass;

							} else {

								preProcessingAO = aoPass;

							}

						}

						if ( preProcessingAO !== null ) {

							node = node ? node.mul( preProcessingAO ) : preProcessingAO;

						}

						return node;


					} );

				postProcessing.outputNode = scenePass;

				//

				const dracoLoader = new DRACOLoader();
				dracoLoader.setDecoderPath( 'jsm/libs/draco/' );
				dracoLoader.setDecoderConfig( { type: 'js' } );
				const loader = new GLTFLoader();
				loader.setDRACOLoader( dracoLoader );
				loader.setPath( 'models/gltf/' );

				const gltf = await loader.loadAsync( 'minimalistic_modern_bedroom.glb' );

				const model = gltf.scene;
				model.position.set( 0, 1, 0 );
				scene.add( model );

				window.addEventListener( 'resize', onWindowResize );

				//

				const gui = new GUI();
				gui.title( 'AO settings' );
				gui.add( params, 'distanceExponent' ).min( 1 ).max( 4 ).onChange( updateParameters );
				gui.add( params, 'distanceFallOff' ).min( 0.01 ).max( 1 ).onChange( updateParameters );
				gui.add( params, 'radius' ).min( 0.01 ).max( 1 ).onChange( updateParameters );
				gui.add( params, 'scale' ).min( 0.01 ).max( 2 ).onChange( updateParameters );
				gui.add( params, 'thickness' ).min( 0.01 ).max( 2 ).onChange( updateParameters );
				gui.add( params, 'enabled' ).onChange( updatePassChain );
				const folder = gui.addFolder( 'Denoise settings' );
				folder.add( params, 'denoiseRadius' ).min( 0.01 ).max( 10 ).name( 'radius' ).onChange( updateParameters );
				folder.add( params, 'lumaPhi' ).min( 0.01 ).max( 10 ).onChange( updateParameters );
				folder.add( params, 'depthPhi' ).min( 0.01 ).max( 10 ).onChange( updateParameters );
				folder.add( params, 'normalPhi' ).min( 0.01 ).max( 10 ).onChange( updateParameters );
				folder.add( params, 'denoised' ).name( 'enabled' ).onChange( updatePassChain );

			}

			function updatePassChain() {

				scenePass.needsUpdate = true;

			}

			function updateParameters() {

				aoPass.distanceExponent.value = params.distanceExponent;
				aoPass.distanceFallOff.value = params.distanceFallOff;
				aoPass.radius.value = params.radius;
				aoPass.scale.value = params.scale;
				aoPass.thickness.value = params.thickness;

				denoisePass.radius.value = params.denoiseRadius;
				denoisePass.lumaPhi.value = params.lumaPhi;
				denoisePass.depthPhi.value = params.depthPhi;
				denoisePass.normalPhi.value = params.normalPhi;

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			function animate() {

				controls.update();

				postProcessing.render();

			}

		</script>
	</body>
</html>
